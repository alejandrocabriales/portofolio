<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <!-- Monogram mark. The amber bar is the safelight; the stroke is the deeproom ink — the same
         short line that leads the nav wordmark, so the tab and the page agree. -->
    <path
        d="M22 102V26l42 50 42-50v76"
        stroke="#1e130a"
        stroke-width="15"
        stroke-linejoin="miter"
        stroke-linecap="butt"
    />
    <rect x="88" y="94" width="30" height="12" fill="#eea743" />
    <style>
        @media (prefers-color-scheme: dark) {
            path { stroke: #f0b04f; }
        }
    </style>
</svg>
